# src/sft/configs/vision_lora.yaml
# Fine-tuning config for Qwen2-VL as specified in Action Plan
lora_config:
  r: 64
  lora_alpha: 16
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training_params:
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5e-5
  num_train_epochs: 3
  bf16: true
